# MotionBERT action finetune config for UP-Fall (window_id samples)
# Start point: configs/action/MB_ft_NTU60_xview.yaml

# General
finetune: True
partial_train: null

# Training
epochs: 100
batch_size: 32
lr_backbone: 0.0001
lr_head: 0.001
weight_decay: 0.01
lr_decay: 0.99

# Model
model_version: class
maxlen: 64          # should be >= clip_len
dim_feat: 512
mlp_ratio: 2
depth: 5
dim_rep: 512
num_heads: 8
att_fuse: True
num_joints: 17
hidden_dim: 2048
dropout_ratio: 0.5

# Data
dataset: upfall     # train_action.py will look for data/action/{dataset}.pkl
data_split: xsub    # expects split keys: xsub_train / xsub_val inside the pkl
clip_len: 64        # resample each window to this length during training
action_classes: 7

# Augmentation
random_move: True
scale_range_train: [1, 3]
scale_range_test: [2, 2]
