{% extends "base.html" %}

{% block content %}
<h1>Fall Detection Web App</h1>
<p>Upload a file to call the placeholder prediction API.</p>

<form id="predict-form" action="/api/predict" method="post" enctype="multipart/form-data">
  <label for="file">Select file</label>
  <input id="file" name="file" type="file" required>
  <button type="submit">Submit File</button>
</form>

<div class="actions">
  <button id="send-json" type="button">Send Sample JSON</button>
</div>

<h2>API Response</h2>
<pre id="response">Submit a file or send sample JSON.</pre>
{% endblock %}
