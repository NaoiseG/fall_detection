{% extends "base.html" %}

{% block content %}
<h1>Fall Detection Web App</h1>
<p>Configure and run inference on a test video.</p>

<div class="inference-controls">
  <label for="classification-model">Classification Model</label>
  <select id="classification-model" name="classification-model">
    <option value="tcn">tcn</option>
    <option value="cnn-lstm">cnn-lstm</option>
    <option value="st-gcn">st-gcn</option>
  </select>

  <label for="keypoint-model">Keypoint Detection Model</label>
  <select id="keypoint-model" name="keypoint-model">
    <option value="ultralytics-yolo11n">ultralytics-yolo11n</option>
    <option value="ultralytics-yolo11s">ultralytics-yolo11s</option>
    <option value="ultralytics-yolo11m">ultralytics-yolo11m</option>
    <option value="ultralytics-yolo11l">ultralytics-yolo11l</option>
    <option value="ultralytics-yolo11x">ultralytics-yolo11x</option>
  </select>

  <label for="video-select">Video</label>
  <select id="video-select" name="video-select">
    <option value="">Loading videos...</option>
  </select>

  <button id="run-inference" type="button">Run</button>
</div>

<h2>API Response</h2>
<p id="run-status">Ready.</p>
<pre id="response">Choose models and a video, then click Run.</pre>
{% endblock %}
